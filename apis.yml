- aid: postgresql:wire-protocol
  name: PostgreSQL Wire Protocol
  description: The PostgreSQL frontend/backend protocol is the low-level message-based protocol used by all client drivers (libpq, JDBC, ODBC, psycopg, pgx, node-postgres, etc.) to communicate with the PostgreSQL server over TCP/IP or Unix sockets. Authentication supports password, SCRAM-SHA-256, MD5, GSSAPI, SSPI, certificate, LDAP, and other pluggable methods.
  humanURL: https://www.postgresql.org/docs/current/protocol.html
  baseURL: postgresql://hostname:5432
  tags:
  - Database
  - Wire Protocol
  - SQL
  - Connection Protocol
  properties:
  - type: Documentation
    url: https://www.postgresql.org/docs/current/protocol.html
  - type: Specification
    url: https://www.postgresql.org/docs/current/protocol-message-formats.html
- aid: postgresql:libpq
  name: libpq C Client Library
  description: libpq is the official C application programmer's interface to PostgreSQL and the underlying library used by most other PostgreSQL client interfaces. It provides connection management, query execution, prepared statements, COPY support, asynchronous operations, and SSL/TLS.
  humanURL: https://www.postgresql.org/docs/current/libpq.html
  baseURL: postgresql://hostname:5432
  tags:
  - Database
  - C Library
  - Client Library
  - libpq
  properties:
  - type: Documentation
    url: https://www.postgresql.org/docs/current/libpq.html
- aid: postgresql:jdbc
  name: PostgreSQL JDBC Driver
  description: The official Type 4 JDBC driver for PostgreSQL enables Java applications to connect to PostgreSQL using the standard JDBC API. It supports connection pooling, prepared statements, batched updates, LOBs, COPY, and SSL connections.
  humanURL: https://jdbc.postgresql.org/documentation/
  baseURL: jdbc:postgresql://hostname:5432/database
  tags:
  - Database
  - JDBC
  - Java
  - Driver
  properties:
  - type: Documentation
    url: https://jdbc.postgresql.org/documentation/
  - type: GitHub
    url: https://github.com/pgjdbc/pgjdbc
- aid: postgresql:odbc
  name: PostgreSQL ODBC Driver (psqlODBC)
  description: The official ODBC driver for PostgreSQL providing Open Database Connectivity for Windows, Linux, and macOS applications including Microsoft Office, Tableau, Power BI, and other BI/ETL tools that consume ODBC data sources.
  humanURL: https://odbc.postgresql.org/
  baseURL: Driver={PostgreSQL};Server=hostname;Port=5432;Database=mydb
  tags:
  - Database
  - ODBC
  - Driver
  - BI Integration
  properties:
